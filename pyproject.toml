[project]
name = "rocky_worlds_ddt"
description = "Modules supporting the Rocky Worlds DDT Project"
readme = "README.rst"
authors = [
  { name = "Mees Fix" },
  { name = "Other Authors" },
]
keywords = ["astronomy", "python"]
classifiers = ["Programming Language :: Python"]
requires-python = ">=3.11"
dependencies = [
    "astropy>=6.1.1",
    "astroquery>=0.4.7",
    "bokeh>=3.6.2",
    "numpy>=2.0.0",
]

dynamic = ["version"]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
]  
docs = [
  "sphinx",
  "sphinx_rtd_theme",
  "stsci_rtd_theme",
]

[project.license]
file = "LICENSE"
content-type = "text/plain"

[build-system]
requires = ["setuptools >= 61.2",
            "setuptools_scm[toml]>=7.1"]
build-backend = 'setuptools.build_meta'

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools_scm]

[tool.pytest]
junit_family = "xunit2"
